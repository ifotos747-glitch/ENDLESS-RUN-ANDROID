
name: Build ENDLESS RUN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz pliki gry
        uses: actions/checkout@v4

      - name: Zainstaluj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Zainstaluj Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Zainstaluj Capacitor
        run: |
          npm install
          npm install @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8

      - name: Utworz projekt Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Zbuduj APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: ENDLESS-RUN-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
